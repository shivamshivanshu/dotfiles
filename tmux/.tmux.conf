
# Use Ctrl-a instead of default Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better history scrollback
set -g history-limit 10000

# Reduce escape delay (default 500ms causes lag in Neovim)
set -g escape-time 10

# Mouse support
set -g mouse on

# Enable true color (matches whatever terminal tmux is run in)
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:RGB"

# Blinking block cursor by default (overrides tmux's steady-block default)
set -g cursor-style blinking-block

# Vi-style copy mode
setw -g mode-keys vi

# Auto-renames windows
set-option -g allow-rename off

# Start with 1-based indexing for windows/panes
set -g base-index 1
setw -g pane-base-index 1

### ──────────────── Pane Navigation ────────────────

# Resize panes with arrow keys
bind -r M-h resize-pane -L 5
bind -r M-l resize-pane -R 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5

### ──────────────── Splits ────────────────

# Split panes, preserving current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind 'C' new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

### ──────────────── Status Bar ────────────────

set -g status on
set -g status-interval 5
set -g status-justify centre
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g renumber-windows on

### ──────────────── Clipboard Integration ────────────────

# Exit copy mode with Escape
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Better vi-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

### ──────────────── Plugins (TPM) ────────────────

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @themepack 'powerline/default/green'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore vim
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Auto-save tmux sessions disabled, save manually
set -g @continuum-restore 'on'
set -g @continuum-save-interval '0'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
