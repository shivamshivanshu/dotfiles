### ──────────────── General ────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 50000

# Default 500ms escape delay causes lag in Neovim
set -g escape-time 10

set -g mouse on

# nvim autoread depends on this; otherwise only set as a tmux-sensible side effect
set -g focus-events on

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:RGB"

# Extended keys off: tmux corrupts pasted newlines for modifyOtherKeys panes (tmux/tmux#4663)
set -as terminal-features 'xterm*:usstyle:hyperlinks'
set -as terminal-features 'alacritty*:RGB:usstyle:hyperlinks'

set -g cursor-style blinking-block
setw -g mode-keys vi
set -g allow-rename off

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S:#I #W"

set -g set-clipboard on
set -g allow-passthrough on

### ──────────────── Splits & Windows ────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind '%' split-window -v -c "#{pane_current_path}"
bind 'C' new-window -c "#{pane_current_path}"

### ──────────────── Pane navigation ────────────────
is_vim_alive='#{&&:#{@pane-is-vim},#{m:*vim,#{pane_current_command}}}'
bind -n C-h if -F "$is_vim_alive" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "$is_vim_alive" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "$is_vim_alive" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "$is_vim_alive" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if -F "$is_vim_alive" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

### ──────────────── Popup & Reload ────────────────

bind Enter display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

### ──────────────── Copy Mode (vi) ────────────────

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

### ──────────────── Multi-pane typing ────────────────

# b: block/unblock this pane's input (blocked = dimmed, excluded from sync typing)
# single command per branch: if-shell re-parses branches on keypress, so an
# embedded \; would become a literal arg ("too many arguments")
bind b if -F '#{pane_input_off}' \
    'select-pane -e -P default' \
    'select-pane -d -P bg=colour236'

# g: group-type — toggle typing into all input-enabled panes of the window
bind g setw synchronize-panes

# e: sync off and re-enable input on every pane (U is taken by TPM update)
# #{P:...} expands once per pane server-side, so the shell gets explicit targets
bind e setw synchronize-panes off \; \
    run-shell '#{P:tmux -S "#{socket_path}" select-pane -e -t "#{pane_id}" -P default; }'

### ──────────────── Plugins (TPM) ────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

### ──────────────── Gruvbox theming (status line & panes) ────────────────
# Hand-rolled from the same hex palette as wezterm/nvim
# (wezterm/.config/wezterm/shivam/appearance.lua, nvim's gruvbox.nvim setup)

set -g status-style 'bg=#3c3836,fg=#ebdbb2'
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40

set -g status-left '#[bg=#d79921,fg=#282828,bold]  #S #[bg=#3c3836,fg=#d79921]'

setw -g window-status-format '  #I:#W  '
setw -g window-status-style 'fg=#a89984,bg=#3c3836'
setw -g window-status-current-format '#[bg=#458588,fg=#282828,bold]  #I:#W  #[bg=#3c3836,fg=#458588]'

set -g status-right '#[fg=#689d6a]#[bg=#689d6a,fg=#282828,bold]  %H:%M  '

# Dull-red pane borders while sync is on (off-branches match the gruvbox colours)
set -g pane-border-style '#{?synchronize-panes,fg=#cc241d,fg=#504945}'
set -g pane-active-border-style '#{?synchronize-panes,fg=#cc241d#,bold,fg=#98971a}'
