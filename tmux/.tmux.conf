### ──────────────── General ────────────────

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g history-limit 50000

# Default 500ms escape delay causes lag in Neovim
set -g escape-time 10

set -g mouse on

# nvim autoread depends on this; otherwise only set as a tmux-sensible side effect
set -g focus-events on

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*256col*:RGB"

# Extended keys off: tmux corrupts pasted newlines for modifyOtherKeys panes (tmux/tmux#4663)
set -as terminal-features 'xterm*:usstyle:hyperlinks'
set -as terminal-features 'alacritty*:RGB:usstyle:hyperlinks'

set -g cursor-style blinking-block
setw -g mode-keys vi
set -g allow-rename off

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on
set -g set-titles-string "#S:#I #W"

set -g set-clipboard on
set -g allow-passthrough on

### ──────────────── Splits & Windows ────────────────

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"
bind '%' split-window -v -c "#{pane_current_path}"
bind 'C' new-window -c "#{pane_current_path}"

### ──────────────── Popup & Reload ────────────────

bind Enter display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

### ──────────────── Copy Mode (vi) ────────────────

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

### ──────────────── Multi-pane typing ────────────────

# b: block/unblock this pane's input (blocked = dimmed, excluded from sync typing)
# single command per branch: if-shell re-parses branches on keypress, so an
# embedded \; would become a literal arg ("too many arguments")
bind b if -F '#{pane_input_off}' \
    'select-pane -e -P default' \
    'select-pane -d -P bg=colour236'

# g: group-type — toggle typing into all input-enabled panes of the window
bind g setw synchronize-panes

# e: sync off and re-enable input on every pane (U is taken by TPM update)
# #{P:...} expands once per pane server-side, so the shell gets explicit targets
bind e setw synchronize-panes off \; \
    run-shell '#{P:tmux -S "#{socket_path}" select-pane -e -t "#{pane_id}" -P default; }'

### ──────────────── Plugins (TPM) ────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'

set -g @themepack 'powerline/default/green'
# Themepack defaults to a 1s status-interval whose #() forks burn ~3% of a core
set -g @theme-status-interval '15'
set -goq @themepack-status-right-area-left-format '%H:%M'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'

### ──────────────── Post-theme overrides ────────────────
# After TPM so these append to / override what the themepack sets

# Dull-red pane borders while sync is on (off-branches match the themepack colours)
set -g pane-border-style '#{?synchronize-panes,fg=colour124,fg=colour238}'
set -g pane-active-border-style '#{?synchronize-panes,fg=colour124#,bold,fg=colour100}'
