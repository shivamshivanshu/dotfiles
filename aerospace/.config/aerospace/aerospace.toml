### ──────────────── General ────────────────
# i3-compatible keymap; alt is $mod (i3's Mod1). Alt reservation and the deliberate
# divergences from i3 are documented in CLAUDE.md.

config-version = 2 # v2 drops inferred persistent-workspaces: a workspace lives only while occupied, like i3

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto' # vertical monitors get a vertical split
accordion-padding = 30

### ──────────────── Gaps ────────────────
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.right = 6
outer.top = 6
outer.bottom = 6

### ──────────────── Workspaces per monitor ────────────────
# Numbers increase left to right across the physical layout. Never use the numeric
# monitor patterns here: they are left-to-right positions and renumber on undock.
[workspace-to-monitor-force-assignment]
1 = ['built-in', 'main'] # laptop; 'main' is the undocked fallback for every entry
2 = ['built-in', 'main']
3 = ['p32p', 'main'] # vertical panel
4 = ['p32p', 'main']
5 = ['dell', 'main'] # wide panel
6 = ['dell', 'main']
7 = ['dell', 'main']
8 = ['dell', 'main']
9 = ['dell', 'main']
10 = ['dell', 'main']

### ──────────────── Focus & move ($mod+hjkl) ────────────────
[mode.main.binding]
alt-h = 'focus --boundaries all-monitors-outer-frame left' # boundaries: focus crosses monitors, not just the workspace
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

### ──────────────── Workspaces ────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-tab = 'workspace-back-and-forth'

### ──────────────── Monitors ────────────────
alt-shift-comma = 'move-workspace-to-monitor --wrap-around prev'  # i3's $mod+shift+< (workspace to output left)
alt-shift-period = 'move-workspace-to-monitor --wrap-around next' # i3's $mod+shift+> (workspace to output right)

### ──────────────── Layout ────────────────
alt-f = 'fullscreen'
alt-e = 'layout tiles horizontal vertical'     # i3's $mod+e: toggle split orientation
alt-w = 'layout accordion horizontal vertical' # i3's $mod+w: accordion stands in for tabbed
alt-shift-space = 'layout floating tiling'

### ──────────────── Windows & config ────────────────
alt-enter = 'exec-and-forget open -na WezTerm'
alt-shift-q = 'close'
alt-shift-c = 'reload-config'

### ──────────────── Modes ────────────────
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service' # housekeeping: reload, flatten tree, join containers

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
