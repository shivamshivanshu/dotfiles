### ──────────────── General ────────────────
# i3-compatible keymap; alt is $mod (i3's Mod1). Alt reservation and the deliberate
# divergences from i3 are documented in CLAUDE.md.

config-version = 2 # v2 drops inferred persistent-workspaces: a workspace lives only while occupied, like i3

start-at-login = true

automatically-unhide-macos-hidden-apps = true # cmd-h would otherwise drop a window out of the tree
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

### ──────────────── Gaps ────────────────
[gaps]
inner = { horizontal = 6, vertical = 6 }
outer = { left = 6, right = 6, top = 6, bottom = 6 }

### ──────────────── Focus & move ($mod+hjkl) ────────────────
[mode.main.binding]
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-semicolon = 'focus-back-and-forth'

### ──────────────── Workspaces ────────────────
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-tab = 'workspace-back-and-forth'

### ──────────────── Monitors ────────────────
alt-shift-comma = 'move-workspace-to-monitor --wrap-around prev'  # i3's $mod+shift+< (workspace to output left)
alt-shift-period = 'move-workspace-to-monitor --wrap-around next' # i3's $mod+shift+> (workspace to output right)
alt-ctrl-comma = 'move-node-to-monitor --wrap-around prev'
alt-ctrl-period = 'move-node-to-monitor --wrap-around next'

### ──────────────── Layout ────────────────
alt-f = 'fullscreen'
alt-e = 'layout tiles horizontal vertical'
alt-w = 'layout accordion horizontal vertical'
alt-shift-space = 'layout floating tiling'

### ──────────────── Windows & config ────────────────
alt-enter = 'exec-and-forget open -na WezTerm'
alt-shift-q = 'close'
alt-shift-c = 'reload-config'

### ──────────────── Modes ────────────────
alt-r = 'mode resize'
alt-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
b = ['balance-sizes', 'mode main']
t = ['enable toggle', 'mode main'] # pause tiling, e.g. while screen sharing
backspace = ['close-all-windows-but-current', 'mode main']
h = ['join-with left', 'mode main']
j = ['join-with down', 'mode main']
k = ['join-with up', 'mode main']
l = ['join-with right', 'mode main']
